# Roda a verificação (lint + testes de regras + testes no navegador) a cada push e pull request.
name: Verificação
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
